# 이슈·PR 에서 @claude 를 부르면 Claude Code 가 응답·구현한다.
# 기반: anthropics/claude-code-action 의 examples/claude.yml
# 저장소에 쓰기 권한이 있는 사용자만 호출할 수 있다(액션 기본 동작).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PR 의 CI 결과를 읽기 위해 필요
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # 둘 중 하나만 저장소 시크릿으로 등록하면 된다.
          #   CLAUDE_CODE_OAUTH_TOKEN: Pro/Max 구독자. `claude setup-token` 으로 발급
          #   ANTHROPIC_API_KEY: API 종량제
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
